<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Inspect the consequences of a UI edit</title><desc id="desc">An illustrative before-and-after comparison of the same component. The button changes from Add to cart to Buy now. Arguseye highlights the changed button and returns accessibility and error differences. Change is evidence to review, not automatic correctness.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#e3eef9"/><stop offset="0.6" stop-color="#f1f0fb"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3ecf9"/><stop offset="1" stop-color="#eae4f6"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8298ae" opacity="0.2"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#30435c" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#7b91ab" stroke-width="1.4"/></marker>
<style>.signal{stroke-dasharray:4 7;animation:flow 8s linear infinite}.alive{animation:breathe 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-110}}@keyframes breathe{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.signal,.alive{animation:none}}</style>
</defs><rect x="0" y="0" width="1200" height="660" rx="24" fill="#f3f6fa" stroke="none" /><rect x="0" y="0" width="1200" height="660" rx="24" fill="url(#dots)" stroke="none" /><g transform="translate(55 45) scale(0.7)"><path d="M-18 0 Q0-24 18 0 Q0 24-18 0Z" fill="none" stroke="#273943" stroke-width="2.8"/><circle r="6.5" fill="#f39b50"/><circle r="2.5" fill="#273943"/></g><text x="80" y="52" fill="#25323c" font-size="22" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Arguseye</text><text x="1148" y="50" fill="#526374" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">Illustrative comparison</text><text x="48" y="108" fill="#263743" font-size="34" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Make a change. See what changed.</text><text x="48" y="138" fill="#66717c" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif" >The same target, props and viewport. Fresh render evidence.</text><rect x="48" y="178" width="349" height="303" rx="12" fill="#fff" stroke="#dfe5ec" filter="url(#shadow)"/><rect x="48" y="178" width="349" height="40" rx="10" fill="#fafbfc" stroke="#dfe5ec" /><circle cx="66" cy="198" r="3.5" fill="#cbd3df"/><circle cx="80" cy="198" r="3.5" fill="#cbd3df"/><circle cx="94" cy="198" r="3.5" fill="#cbd3df"/><text x="124" y="203" fill="#52606e" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Captured baseline</text><rect x="72" y="239" width="301" height="155" rx="8" fill="#f7f9fc" stroke="#e7ebf1" /><text x="92" y="277" fill="#263743" font-size="21" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Studio headphones</text><text x="92" y="307" fill="#66717c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" >$99.00</text><rect x="92" y="329" width="214" height="42" rx="7" fill="#283d4d" stroke="none" /><text x="199" y="356" fill="#fff" font-size="16" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Add to cart</text><text x="72" y="435" fill="#526374" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >ProductCard.tsx</text><text x="72" y="458" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Same resolved inputs</text><rect x="427" y="178" width="349" height="303" rx="12" fill="#fff" stroke="#dfe5ec" filter="url(#shadow)"/><rect x="427" y="178" width="349" height="40" rx="10" fill="#fafbfc" stroke="#dfe5ec" /><circle cx="445" cy="198" r="3.5" fill="#cbd3df"/><circle cx="459" cy="198" r="3.5" fill="#cbd3df"/><circle cx="473" cy="198" r="3.5" fill="#cbd3df"/><text x="503" y="203" fill="#52606e" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Current source</text><rect x="451" y="239" width="301" height="155" rx="8" fill="#f7f9fc" stroke="#e7ebf1" /><text x="471" y="277" fill="#263743" font-size="21" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Studio headphones</text><text x="471" y="307" fill="#66717c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" >$99.00</text><rect x="471" y="329" width="214" height="42" rx="7" fill="#283d4d" stroke="none" /><text x="578" y="356" fill="#fff" font-size="16" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Buy now</text><rect x="463" y="321" width="230" height="58" rx="10" fill="none" stroke="#8673ba" stroke-width="2" stroke-dasharray="5 4"/><text x="451" y="435" fill="#526374" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >ProductCard.tsx</text><text x="451" y="458" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Same resolved inputs</text><rect x="806" y="178" width="346" height="303" rx="12" fill="#fff" stroke="#dfe5ec" filter="url(#shadow)"/><rect x="806" y="178" width="346" height="40" rx="10" fill="#fafbfc" stroke="#dfe5ec" /><circle cx="824" cy="198" r="3.5" fill="#cbd3df"/><circle cx="838" cy="198" r="3.5" fill="#cbd3df"/><circle cx="852" cy="198" r="3.5" fill="#cbd3df"/><text x="882" y="203" fill="#52606e" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Comparison evidence</text><rect x="830" y="239" width="104" height="31" rx="7" fill="#eeebf8" stroke="none" /><text x="882" y="260" fill="#5c4b82" font-size="14" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Changed</text><text x="830" y="302" fill="#263743" font-size="15" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Accessibility</text><text x="830" y="331" fill="#86616c" font-size="15" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >− button &quot;Add to cart&quot;</text><text x="830" y="359" fill="#385f55" font-size="15" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >+ button &quot;Buy now&quot;</text><path d="M830 382 H1126" fill="none" stroke="#dfe5ec" /><text x="830" y="413" fill="#66717c" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" >New errors</text><text x="1126" y="413" fill="#385f55" font-size="15" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="end">none</text><text x="830" y="449" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Review the highlighted change.</text><rect x="48" y="519" width="1104" height="93" rx="10" fill="#e9edf6" stroke="none" /><circle cx="82" cy="554" r="5" fill="#7e70ac" class="alive"/><text x="99" y="560" fill="#344858" font-size="21" font-weight="600" font-family="Arial, Helvetica, sans-serif" >An edit is visible. Its correctness is yours to assess.</text><text x="73" y="590" fill="#526374" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Capture a baseline → edit your component → compare pixels, dimensions, accessibility and errors.</text>
</svg>
