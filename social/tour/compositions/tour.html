    <div class="title t-big" id="t3b" data-layout-allow-overflow><span class="m"><span class="w iris">sees </span></span><span class="m"><span class="w iris">it </span></span><span class="m"><span class="w iris">too.</span></span></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const B = (k) => 0.625 * k; // 96 BPM beat grid

      // ---- camera over the VS Code recording (log-space zoom, prompt-motion ultimaxbt-2ddf1e) ----
      const cam = document.getElementById("cam");
      const st = { x: 31, y: 400, lz: Math.log(0.5302) };
      const apply = () => { cam.style.transform = `translate(${st.x}px, ${st.y}px) scale(${Math.exp(st.lz)})`; };
      apply();
      tl.to(st, { x: -1175, y: 300, lz: Math.log(1.2), duration: 0.6, ease: "power2.inOut", onUpdate: apply }, B(8));
      tl.to("#shot", { clipPath: "inset(300px 0px 0px 0px round 0px)", duration: 0.6, ease: "power2.inOut" }, B(8));

      // ---- cut-the-curve seams, current = LEFT (±130 px, mirrored power4, ignite at 0.35) ----
      function exitLeft(sel, t) {
        tl.to(sel, { x: -130, duration: 0.3, ease: "power4.in" }, t - 0.3);
        tl.to(sel, { opacity: 0, duration: 0.22, ease: "none" }, t - 0.24);
      }
      function enterLeft(sel, t) {
        tl.set(sel, { x: 130, opacity: 0.35 }, t);
        tl.to(sel, { x: 0, duration: 0.34, ease: "power4.out" }, t);
        tl.to(sel, { opacity: 1, duration: 0.2, ease: "none" }, t);
      }
      exitLeft("#split", B(5)); enterLeft("#shotwrap", B(5));
      for (const k of [9, 12, 15]) { exitLeft("#shotwrap", B(k)); enterLeft("#shotwrap", B(k)); }
      exitLeft("#shotwrap", B(18)); enterLeft("#agent", B(18));
      exitLeft("#agent", B(25)); enterLeft("#stat", B(25));
      tl.to("#statnote", { opacity: 1, duration: 0.3, ease: "none" }, B(25) + 0.3);

      // ---- kinetic type: masked line reveals (words rise out of their own mask), exits leave upward ----
      const W = (sel) => Array.from(document.querySelectorAll(sel + " .w"));
      function rise(sel, t, gap = 0.06, dur = 0.55) {
        W(sel).forEach((w, i) => { gsap.set(w, { yPercent: 115 }); tl.to(w, { yPercent: 0, duration: dur, ease: "expo.out" }, t + i * gap); });
      }
      function sink(sel, t, gap = 0.025) {
        W(sel).forEach((w, i) => tl.to(w, { yPercent: -115, duration: 0.28, ease: "power3.in" }, t - 0.28 + i * gap));
      }
      function soft(sel, t, gap = 0.06) {
        W(sel).forEach((w, i) => { gsap.set(w, { opacity: 0, filter: "blur(6px)" }); tl.to(w, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t + i * gap); });
      }
      // hook: frame 0 already reads; the underline draws under "dev server" and "isn't" lands with a punch
      gsap.set("#t1u", { scaleX: 0 });
      tl.to("#t1u", { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.25);
      tl.fromTo("#isnt", { scale: 1.18 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 0.35);
      soft("#t1b", 0.6);
      sink("#t1", B(5)); sink("#t1b", B(5));
      tl.to("#t1u", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.2, ease: "power3.in" }, B(5) - 0.24);
      // tour: "Open any" + a slot-machine roll synced to each render landing
      rise("#t2", B(5) + 0.02);
      gsap.set("#t2r .rollwin", { clipPath: "inset(0 0 100% 0)" });
      tl.to("#t2r .rollwin", { clipPath: "inset(0 0 0% 0)", duration: 0.5, ease: "expo.out" }, B(5) + 0.14);
      const rollTo = (i, t) => tl.to("#rollstack", { yPercent: -20 * i, duration: 0.42, ease: "power4.out" }, t);
      rollTo(1, B(8)); rollTo(2, B(10)); rollTo(3, B(13)); rollTo(4, B(16));
      soft("#t2b", B(8) + 0.12);
      sink("#t2", B(18)); sink("#t2b", B(18));
      tl.to("#t2r .rollwin", { clipPath: "inset(100% 0 0 0)", duration: 0.28, ease: "power3.in" }, B(18) - 0.28);
      // agent: two masked lines, the second in the accent
      rise("#t3", B(18) + 0.04); rise("#t3b", B(18) + 0.22);
      sink("#t3", B(25)); sink("#t3b", B(25));
      rise("#t4", B(25) + 0.04);
      // ---- agent panel: lines type and land on beats ----
      const typeOn = (sel, t, d) => { gsap.set(sel, { clipPath: "inset(0 100% 0 0)" }); tl.to(sel, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "none" }, t); };
      typeOn("#cmd1", B(18) + 0.25, 0.55);
      gsap.set("#res1 > *", { opacity: 0 });
      tl.to("#res1 > *", { opacity: 1, duration: 0.15, stagger: 0.12, ease: "none" }, B(20));
      typeOn("#cmd2", B(21) + 0.1, 0.5);
      gsap.set(["#box390", "#box320"], { opacity: 0, y: 16 });
      tl.to("#box390", { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, B(22));
      tl.to("#box320", { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, B(22) + 0.12);
      tl.to("#ring", { opacity: 1, duration: 0.15, ease: "none" }, B(23));

      // ---- stat: 6 counts up, then 2 slams in on the next beat ----
      const n6 = { v: 0 };
      tl.to(n6, { v: 6, duration: 0.55, ease: "power2.out", onUpdate: () => (document.getElementById("n6").textContent = Math.round(n6.v)) }, B(25) + 0.1);
      gsap.set("#n2", { opacity: 0, scale: 1.7 });
      tl.to("#n2", { opacity: 1, duration: 0.08, ease: "none" }, B(26));
      tl.to("#n2", { scale: 1, duration: 0.5, ease: "expo.out" }, B(26));

      // ---- end: inverse zoom-through arrival, then the wordmark letter by letter ----
      tl.to(["#stat", "#statnote", "#t4"], { scale: 0.8, duration: 0.2, ease: "power3.in" }, B(29) - 0.2);
      tl.to(["#stat", "#statnote", "#t4"], { opacity: 0, duration: 0.2, ease: "none" }, B(29) - 0.2);
      tl.set("#end", { scale: 1.25, opacity: 0.15 }, B(29));
      tl.to("#end", { scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, B(29));
      document.querySelectorAll("#wordmark .ch").forEach((c, i) => {
        gsap.set(c, { opacity: 0, y: 34, filter: "blur(6px)" });
        tl.to(c, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, B(29) + 0.15 + i * 0.035);
      });
      rise("#endline", B(30) + 0.1, 0.05);
      gsap.set(["#end .meta"], { opacity: 0 });
      tl.to("#end .meta", { opacity: 1, duration: 0.3, ease: "none" }, B(31));
      gsap.set("#end .url", { clipPath: "inset(0 100% 0 0)" });
      tl.to("#end .url", { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "none" }, B(31) + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["tour"] = tl;
    })();
  </script>
