space, SFMono-Regular, Consolas, monospace" >08</text><text x="109" y="417" fill="#53677b" font-size="15" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >  );</text><text x="76" y="443" fill="#9aa5b1" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >09</text><text x="109" y="443" fill="#53677b" font-size="15" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >}</text><path d="M70 476 H540" fill="none" stroke="#dfe5ec" /><text x="76" y="503" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Usage inputs stay traceable to your source.</text><path class="signal" d="M566 289 H640" fill="none" stroke="#7b91ab" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="92" width="502" height="434" rx="14" fill="#fff" stroke="#dfe5ec" filter="url(#shadow)"/><rect x="650" y="92" width="502" height="40" rx="10" fill="#fafbfc" stroke="#dfe5ec" /><circle cx="668" cy="112" r="3.5" fill="#cbd3df"/><circle cx="682" cy="112" r="3.5" fill="#cbd3df"/><circle cx="696" cy="112" r="3.5" fill="#cbd3df"/><text x="726" y="117" fill="#52606e" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Preview / ProductCard</text><rect x="672" y="151" width="132" height="29" rx="7" fill="#eef5fa" stroke="none" /><text x="688" y="171" fill="#40627c" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Chromium render</text><text x="1128" y="171" fill="#66717c" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="end">Cropped to the component</text><rect x="690" y="201" width="422" height="278" rx="9" fill="#f7f9fc" stroke="#dce4ee" /><rect x="722" y="220" width="358" height="229" rx="13" fill="#fff" stroke="#dbe1eb" /><rect x="744" y="239" width="100" height="100" rx="12" fill="url(#surface)" stroke="none" /><g transform="translate(794 289)" fill="none" stroke