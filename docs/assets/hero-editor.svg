    <text x="60" y="254" class="code"><tspan class="dim">7 </tspan>    &lt;/<tspan class="tag">article</tspan>&gt;</text>
    <text x="60" y="278" class="code"><tspan class="dim">8 </tspan>  );</text>
    <text x="60" y="302" class="code"><tspan class="dim">9 </tspan>}</text>
