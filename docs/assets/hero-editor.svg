    <text x="60" y="206" class="code"><tspan class="dim">5 </tspan>      &lt;<tspan class="tag">h2</tspan>&gt;{title}&lt;/<tspan class="tag">h2</tspan>&gt; &lt;<tspan class="tag">p</tspan>&gt;{format(price)}&lt;/<tspan class="tag">p</tspan>&gt;</text>
