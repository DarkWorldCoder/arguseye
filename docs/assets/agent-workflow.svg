<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">How Arguseye gives coding agents eyes</title><desc id="desc">Four steps: select an actual source component and usage, render locally with project packages, inspect a cropped PNG and accessibility evidence, then edit and compare against a baseline. Incomplete inputs and render errors are reported.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#e3eef9"/><stop offset="0.6" stop-color="#f1f0fb"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3ecf9"/><stop offset="1" stop-color="#eae4f6"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8298ae" opacity="0.2"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#30435c" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#7b91ab" stroke-width="1.4"/></marker>
<style>.signal{stroke-dasharray:4 7;animation:flow 8s linear infinite}.alive{animation:breathe 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-110}}@keyframes breathe{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.signal,.alive{animation:none}}</style>
</defs><rect x="0" y="0" width="1200" height="400" rx="22" fill="#f7f9fc" stroke="none" /><text x="40" y="55" fill="#263743" font-size="27" font-weight="600" font-family="Arial, Helvetica, sans-serif" >A visual feedback loop for your coding agent</text><text x="40" y="84" fill="#66717c" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Direct source in. Reviewable evidence out.</text><rect x="40" y="124" width="235" height="210" rx="12" fill="#fff" stroke="#dfe5ec" /><rect x="58" y="142" width="34" height="30" rx="7" fill="#edf1f9" stroke="none" /><text x="75" y="162" fill="#586b83" font-size="13" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">01</text><text x="58" y="208" fill="#263743" font-size="25" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Select</text><text x="58" y="235" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >A source file + usage</text><text x="58" y="280" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >ProductCard.tsx</text><text x="58" y="307" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >app/page.tsx:9</text><path class="signal" d="M284 228 H322" fill="none" stroke="#7b91ab" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="335" y="124" width="235" height="210" rx="12" fill="#fff" stroke="#dfe5ec" /><rect x="353" y="142" width="34" height="30" rx="7" fill="#edf1f9" stroke="none" /><text x="370" y="162" fill="#586b83" font-size="13" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">02</text><text x="353" y="208" fill="#263743" font-size="25" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Render</text><text x="353" y="235" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Your project’s packages</text><text x="353" y="280" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >React / Vue 3</text><text x="353" y="307" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >Chromium pixels</text><path class="signal" d="M579 228 H617" fill="none" stroke="#7b91ab" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="630" y="124" width="235" height="210" rx="12" fill="#fff" stroke="#dfe5ec" /><rect x="648" y="142" width="34" height="30" rx="7" fill="#edf1f9" stroke="none" /><text x="665" y="162" fill="#586b83" font-size="13" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">03</text><text x="648" y="208" fill="#263743" font-size="25" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Inspect</text><text x="648" y="235" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Compact, readable results</text><text x="648" y="280" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >Cropped PNG</text><text x="648" y="307" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >Snapshot + errors</text><path class="signal" d="M874 228 H912" fill="none" stroke="#7b91ab" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="925" y="124" width="235" height="210" rx="12" fill="#fff" stroke="#dfe5ec" /><rect x="943" y="142" width="34" height="30" rx="7" fill="#edf1f9" stroke="none" /><text x="960" y="162" fill="#586b83" font-size="13" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">04</text><text x="943" y="208" fill="#263743" font-size="25" font-weight="600" font-family="Arial, Helvetica, sans-serif" >Compare</text><text x="943" y="235" fill="#66717c" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif" >The consequences of edits</text><text x="943" y="280" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >Capture → edit</text><text x="943" y="307" fill="#43617d" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" >Before / after evidence</text><text x="40" y="375" fill="#66717c" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" >Runtime inputs, missing context and unsettled assets stay explicit. A render is evidence, not a correctness verdict.</text>
</svg>
