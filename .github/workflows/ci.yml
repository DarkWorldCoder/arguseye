name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install fixture apps
        run: for d in test/fixtures/*/; do (cd "$d" && npm ci --no-audit --no-fund); done
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: VS Code integration test
        run: xvfb-run -a npm run test:vscode
