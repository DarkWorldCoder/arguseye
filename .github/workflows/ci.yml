name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '4.0.23'
      - name: Install fixture apps
        run: node scripts/installFixtures.mjs
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: VS Code integration test
        run: xvfb-run -a npm run test:vscode
