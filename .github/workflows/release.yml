name: Release
on:
  push:
    tags: ["v*"]

jobs:
  vsix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Stop Spotlight indexing on macOS
        # A fresh macOS runner indexes every file the installs below write (tens of thousands in node_modules),
        # which kept the 3-core VM busy through the whole timing preflight. Indexing is not part of the product.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mdutil -a -i off || true
          sudo mdutil -a -s || true
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '4.0.23'
      - name: Install real fixture packages
        shell: bash
        run: node scripts/installFixtures.mjs
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - name: Record native timing conditions
        if: runner.os == 'macOS'
        run: node scripts/prepareNativeBenchmark.mjs
      - name: Native framework and MCP contracts
        if: runner.os != 'Linux'
        run: npx vitest run test/browser/render.test.ts test/browser/vue.test.ts test/browser/svelte.test.ts test/browser/preact.test.ts test/browser/solid.test.ts test/browser/html.test.ts test/browser/mcp.test.ts test/browser/theme.test.ts test/browser/live.test.ts test/browser/usageContext.test.ts test/browser/motion.test.ts test/browser/templates.test.ts test/browser/inspection.test.ts test/browser/captureEnvironment.test.ts test/browser/evidence.test.ts --maxWorkers 1
      - name: Full test suite on Linux
        if: runner.os == 'Linux'
        run: npm test
      - run: npm run build
      - name: Package and execute the exact release VSIX on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/nativeConformance.mjs
      - name: Package and execute the exact release VSIX on Windows and macOS
        if: runner.os != 'Linux'
        run: node scripts/nativeConformance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: artifacts/native-conformance/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: artifacts/native-conformance/*.json

  github-release:
    needs: vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/vsix-*/*.vsix
          generate_release_notes: true

  marketplace:
    # Trusted publishing: the Marketplace policy for this repo + workflow exchanges the GitHub OIDC token, no PAT.
    needs: vsix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: for f in artifacts/*/*.vsix; do npx @vscode/vsce publish --oidc --packagePath "$f"; done

  npm:
    # Skipped until the NPM_TOKEN secret exists (or npm trusted publishing is configured).
    needs: vsix
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run publish:npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
