name: Uncommitted release patch validation
on:
  push:
    branches: [codex/windows-path-probe]
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact candidate patch
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess
          subprocess.run(['git','apply','-'], input=base64.b64decode(''), check=True)
          actual=hashlib.sha256(pathlib.Path('src/server/moduleGraph.ts').read_bytes()).hexdigest()
          assert actual == 'be6097bae6887817ba0c6579a632286e0e3d69b9175bef428f49d192ad662ac9', actual
          print('Verified candidate moduleGraph.ts SHA-256: '+actual)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '4.0.23'
      - run: node scripts/installFixtures.mjs
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
